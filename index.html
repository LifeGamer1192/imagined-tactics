  <style>
    :root { color-scheme: dark; --bg: #1c1a17; --panel: #26221d; --line: #4a4136; --ink: #ece4d2; --dim: #a39a88; --accent: #c8553a; --gold: #c9a45a; --card: #1f1c18; --mincho: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS PMincho", serif; }
    * { box-sizing: border-box; }
    html, body, #app { height: 100%; margin: 0; }
    /* スマホ・タブレット：アドレス欄の出入りで高さが変わっても画面に収める。引っぱって更新・2度押しの拡大・長押しの選択を止める */
    @supports (height: 100dvh) { html, body, #app { height: 100dvh; } }
    html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #app { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    button, .btn, .chip, .turn, canvas { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #panel, #log, .gens, .help-body, .result { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; overflow-wrap: anywhere; }
    /* 長い名前：札やボタンの中では途中で切り、見出しでは折り返す */
    .nm { display: inline-block; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    .wrap { overflow-wrap: anywhere; }
    input.name { font: inherit; font-size: 16px; padding: 6px 8px; width: min(28em, 78vw); color: var(--ink); background: #14120f; border: 1px solid var(--line); border-radius: 4px; }
    /* 絵を敷いた画面（src/ui/scene.ts）：編成の画面は陣営の絵を暗く敷き、情報欄・窓は和紙の質感 */
    body.scene { background: linear-gradient(rgba(20,18,15,0.38), rgba(20,18,15,0.72)), var(--scene-bg, none) center / cover no-repeat fixed, var(--bg); }
    body.scene .setup section { background-color: rgba(31,28,24,0.74); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
    body.scene .setup header { text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    /* 地図の横の情報欄：和紙の質感の上に、下のほうへ陣営の絵を薄く敷く */
    body .battle aside { background-color: var(--panel); background-image: linear-gradient(rgba(38,34,29,0.93) 0%, rgba(38,34,29,0.9) 45%, rgba(38,34,29,0.58) 100%), var(--aside-scene, none), var(--panel-bg, none); background-size: 100% 100%, auto 48%, cover; background-position: center, bottom center, center; background-repeat: no-repeat; }
    body .result, body .help { background-color: var(--panel); background-image: linear-gradient(rgba(38,34,29,0.45), rgba(38,34,29,0.62)), var(--panel-bg, none); background-size: cover; background-position: center; }
    body .card { background: rgba(24,21,18,0.78); }
    .gens2 .gen, .gen.reserve { background: rgba(24,21,18,0.35); }
    .result { border-color: #6b5a3e; box-shadow: 0 0 0 1px rgba(201,164,90,0.25) inset, 0 14px 50px rgba(0,0,0,0.6); }
    .result h2 { letter-spacing: 0.08em; }
    .result h2::after { content: ""; display: block; width: 120px; height: 2px; margin: 6px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .banner { height: clamp(90px, 18vh, 170px); margin: 0 0 12px; border-radius: 6px; background: center / cover no-repeat; box-shadow: 0 0 0 1px rgba(201,164,90,0.35); -webkit-mask-image: linear-gradient(#000 75%, transparent); mask-image: linear-gradient(#000 75%, transparent); }
    .where .from { color: #ff9c80; font-weight: bold; } .where .to { color: #f0cf7a; font-weight: bold; }
    /* 地図を見せたい窓（攻め込む・攻められる）は、下のほうに出す */
    body .result.low { top: auto; bottom: 12px; transform: translateX(-50%); max-height: 56vh; }
    .rec { flex-wrap: wrap; max-width: 100%; } .rec select { max-width: min(100%, 240px); min-width: 0; text-overflow: ellipsis; }
.cbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin: 3px 0 4px; max-width: 100%; }
.cbar-track { flex: 1 1 120px; min-width: 0; display: flex; height: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(201,162,39,0.45); border-radius: 3px; overflow: hidden; }
.cbar .seg { display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; color: #1a1612; border-right: 1px solid rgba(26,22,18,0.6); overflow: hidden; white-space: nowrap; }
.cbar .seg.s0 { background: #c9a227; } .cbar .seg.s1 { background: #e0c36a; }
.cbar-num { font-size: 11.5px; white-space: normal; }
.chip .tcost { font-size: 10px; margin-left: 4px; padding: 0 3px; border-radius: 2px; background: rgba(201,162,39,0.25); color: #e8cf86; }
.envoy label { display: block; margin: 6px 0; } .envoy select { max-width: 100%; }
.envoy .ng, #panel .ng { color: #e08a6a; } #panel .okc { color: #9fd08a; } .envoy .okc { color: #9fd08a; }
#envPlan { margin: 6px 0; padding: 4px 6px; background: rgba(255,255,255,0.05); border-radius: 4px; }
.actions button.flash { animation: actflash 0.55s ease-in-out 2; }
@keyframes actflash { 0%, 100% { box-shadow: none; } 50% { box-shadow: 0 0 0 3px rgba(255,214,120,0.9), 0 0 14px rgba(255,214,120,0.8); background: rgba(201,162,39,0.35); } }
.actions button small.why { display: block; font-size: 10.5px; color: #d9a08a; opacity: 1; }
.actions button:disabled { filter: grayscale(1); }
.cellinfo { font-size: 12.5px; line-height: 1.5; background: rgba(255,255,255,0.05); border-left: 3px solid rgba(201,162,39,0.6); padding: 3px 6px; margin-top: 4px; }
body .result.victory-box { z-index: 46; width: min(640px, 94vw); max-height: 90vh; overflow: hidden auto; text-align: center; border: 2px solid #d9b44a; animation: vpop 0.5s cubic-bezier(.2,1.4,.4,1), vglow 1.6s ease-in-out infinite alternate; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5); }
@keyframes vpop { from { transform: translate(-50%, -50%) scale(0.6); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
@keyframes vglow { from { box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5), 0 0 18px rgba(255,210,90,0.5); } to { box-shadow: 0 0 0 100vmax rgba(0,0,0,0.5), 0 0 42px rgba(255,220,120,0.95); } }
.victory-box .kachidoki { font: 700 30px var(--mincho); color: #ffd774; letter-spacing: 0.3em; text-shadow: 0 0 12px rgba(255,200,80,0.9), 0 2px 0 #6b3d10; animation: vcry 0.9s ease-out; margin-top: 6px; }
@keyframes vcry { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(0.95); opacity: 1; } 100% { transform: scale(1); } }
.victory-box h2 { font-size: 26px; margin: 4px 0; color: #fff3cf; }
.victory-box .vsub { margin: 0 0 8px; font-size: 13px; }
.victory-box .vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; font-size: 13px; }
.victory-box h4 { margin: 6px 0 2px; color: #ffd774; font-size: 13.5px; }
.victory-box ul { margin: 0; padding-left: 1.2em; }
.victory-box .leaves { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.victory-box .leaf { position: absolute; top: -12px; width: 8px; height: 12px; background: linear-gradient(135deg, #fff1a8, #d9a520); border-radius: 2px; opacity: 0.9; animation: vleaf linear infinite; }
@keyframes vleaf { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(95vh) rotate(540deg); opacity: 0.2; } }
@media (max-width: 600px) { .victory-box .vgrid { grid-template-columns: 1fr; } .victory-box .kachidoki { font-size: 22px; } }
.reel-cover { position: fixed; inset: 0; z-index: 39; background: transparent; }
body .result.reel { z-index: 40; width: min(620px, 94vw); overflow-y: auto; }
.result.reel h2 { margin: 2px 0 4px; font-size: 20px; }
.reel-head { text-align: center; }
.reel-body { display: flex; gap: 10px; align-items: flex-start; text-align: left; }
.reel-mapbox { flex: none; text-align: center; } .reel-round { margin-top: 2px; }
.reel-detail { margin-top: 4px; font-weight: 400; }
.reel-map { width: 210px; height: auto; border-radius: 4px; flex: none; image-rendering: pixelated; }
.reel-sides p { margin: 3px 0; font-size: 13px; }
.reel-result { font-size: 15px; margin: 4px 0 6px; text-align: center; }
@media (max-width: 600px) { .reel-body { flex-direction: column; align-items: center; } .reel-map { width: 96px; } }
body .result.low .banner { height: clamp(60px, 10vh, 110px); }
    /* 天気の欄：天気の帯の絵を敷く。開戦のときと天気が変わったときは、しばらく金の縁で光らせる */
    body .sky { position: relative; background: linear-gradient(90deg, rgba(24,21,18,0.92) 0%, rgba(24,21,18,0.72) 55%, rgba(24,21,18,0.35) 100%), var(--sky-bg, none) center / cover, var(--card); min-height: 0; transition: box-shadow 0.4s, border-color 0.4s; }
    body .sky.night { background: linear-gradient(90deg, rgba(14,16,30,0.94) 0%, rgba(14,16,30,0.78) 55%, rgba(14,16,30,0.5) 100%), var(--sky-bg, none) center / cover, var(--card); }
    body .sky.flash { border-left-color: #ffd36b; box-shadow: 0 0 0 2px rgba(255,211,107,0.85), 0 0 18px rgba(255,200,90,0.55); animation: sky-in 0.5s ease-out; }
    body .sky.flash b { color: #ffe39a; font-size: 15px; }
    @keyframes sky-in { from { transform: scale(1.04); filter: brightness(1.5); } to { transform: none; filter: none; } }
    /* 開戦：地図の真ん中に、墨の筆の帯と大きな文字を一瞬だけ */
    .splash { position: absolute; z-index: 20; left: calc((100% - 340px) / 2); top: 42%; transform: translate(-50%, -50%); width: min(560px, 80vw); height: 150px; display: flex; align-items: center; justify-content: center; pointer-events: none; background: var(--brush-ink) center / 100% 100% no-repeat; animation: splash 1.6s ease-out forwards; }
    .splash span { font: 800 64px var(--mincho); color: #fff6e8; letter-spacing: 0.3em; text-shadow: 0 2px 10px rgba(0,0,0,0.8); padding-left: 0.3em; }
    @keyframes splash { 0% { opacity: 0; transform: translate(-50%, -50%) scaleX(0.3); } 18% { opacity: 1; transform: translate(-50%, -50%) scaleX(1.04); } 30% { transform: translate(-50%, -50%) scaleX(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -52%); } }
    .compass { position: absolute; z-index: 5; left: 10px; top: 10px; width: 54px; height: 54px; border-radius: 50%; background: rgba(36,30,22,0.78); border: 1px solid #8a7347; box-shadow: 0 2px 6px rgba(0,0,0,0.5); cursor: help; }
.compass .needle { position: absolute; inset: 0; display: block; transition: transform 0.3s; }
.compass .needle i { position: absolute; left: 50%; top: 7px; width: 0; height: 0; margin-left: -6px; border: 6px solid transparent; border-bottom: 16px solid #c8553a; border-top: 0; }
.compass .needle b { position: absolute; left: 0; right: 0; top: 23px; text-align: center; font: 700 13px var(--mincho); color: #f4ead6; }
.splash.turn { height: 96px; width: min(420px, 70vw); animation-duration: 1.05s; }
.splash.turn span { font-size: 34px; letter-spacing: 0.15em; padding-left: 0.15em; }
@media (max-width: 760px) {
  .compass { width: 38px; height: 38px; left: 4px; top: 4px; opacity: 0.88; }
  .compass .needle i { top: 4px; margin-left: -4px; border-width: 0 4px 11px; }
  .compass .needle b { top: 16px; font-size: 10px; }
}
@media (max-width: 760px) { .splash { left: 50%; top: 23%; height: 100px; } .splash span { font-size: 42px; } .splash.turn { height: 70px; } .splash.turn span { font-size: 24px; } }
    /* 決着の見出し：朱の筆の帯の上に白い文字（負けたときは、墨を薄くした帯） */
    body .result h2.brushed { position: relative; display: inline-block; padding: 10px 46px 12px; color: #fff6e8; text-shadow: 0 2px 6px rgba(0,0,0,0.7); isolation: isolate; }
    body .result h2.brushed::before { content: ""; position: absolute; inset: -6px -10px; z-index: -1; background: var(--brush-red) center / 100% 100% no-repeat; }
    body .result h2.brushed.lost::before { background-image: var(--brush-ink); filter: invert(0.55) sepia(0.3); }
    body .result h2.brushed::after { display: none; }
    /* 窓の四隅の飾り（金の雲形） */
    body .result, body .help { --cs: 46px; }
    body .result::before, body .result::after { content: ""; position: absolute; width: var(--cs); height: var(--cs); pointer-events: none; opacity: 0.9; }
    body .result::before { left: 4px; top: 4px; background: var(--corner-tl) left top / contain no-repeat; }
    body .result::after { right: 4px; bottom: 4px; background: var(--corner-br) right bottom / contain no-repeat; }
    body .result > .banner:first-child { margin-top: 4px; }
    /* 場面の挿絵（知らせ・窓の上）。小さめ */
    .vignette { height: clamp(80px, 14vh, 130px); margin: 0 0 8px; border-radius: 5px; background: center / cover no-repeat; box-shadow: 0 0 0 1px rgba(201,164,90,0.35); -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
    /* 武将の後ろ姿（顔は描かない）と、領の町の絵 */
    .fig { width: 34px; height: 46px; flex: 0 0 34px; object-fit: contain; object-position: bottom; margin: -2px 0 0 -2px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }
    .town { position: absolute; right: 8px; top: 6px; width: 64px; height: 44px; object-fit: contain; filter: sepia(0.2) brightness(1.05) drop-shadow(0 1px 2px rgba(0,0,0,0.5)); background: rgba(236,228,210,0.85); border-radius: 4px; padding: 2px; }
    /* 説明の小窓（src/ui/tip.ts） */
    .tip { position: fixed; z-index: 80; padding: 8px 11px; background: rgba(18,16,13,0.97); color: var(--ink); border: 1px solid #8a7347; border-radius: 6px; font-size: 12.5px; line-height: 1.6; white-space: pre-line; box-shadow: 0 8px 26px rgba(0,0,0,0.6); pointer-events: none; }
    .trait { border-bottom: 1px dotted rgba(201,164,90,0.7); cursor: help; }
    .udesc { flex-basis: 100%; white-space: pre-line; color: #cfc6b3; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
    .minfo { white-space: pre-line; font-size: 12.5px; color: #d9cfbb; background: rgba(12,10,8,0.6); border-left: 3px solid var(--gold); border-radius: 3px; padding: 6px 8px; margin: 4px 0; }
    table.expect { border-collapse: collapse; font-size: 12.5px; width: 100%; margin: 2px 0 6px; }
    table.expect th, table.expect td { border-bottom: 1px solid var(--line); padding: 2px 4px; text-align: right; }
    table.expect th:first-child, table.expect td:first-child { text-align: left; }
    table.expect th { color: var(--dim); font-weight: normal; }
    /* 確かめる窓：画面の真ん中に、後ろを暗くして出す */
    body .result.confirm { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 45; width: min(520px, 92vw); text-align: left; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.45), 0 14px 50px rgba(0,0,0,0.6); }
    body .result.confirm h2 { text-align: center; }
    body .result.confirm:has(.profile) { width: min(680px, 94vw); max-height: 88vh; overflow-y: auto; }
.profile h3 { margin: 12px 0 4px; font: 700 16px var(--mincho); border-bottom: 1px solid rgba(201,162,39,0.35); }
.profile h4 { margin: 8px 0 2px; font-size: 13px; color: var(--gold, #c9a227); }
.profile p { margin: 2px 0; }
details.pf-more { max-height: none; margin: 0 0 4px; } details.pf-more > summary { cursor: pointer; color: var(--gold, #c9a227); font-size: 12px; }
.pf-head { display: flex; gap: 10px; align-items: center; }
.pf-head .fig { width: 64px; height: auto; }
/* 攻撃の見込みの図（P78） */
.fcard { border: 1px solid rgba(201,162,39,0.65); background: rgba(0,0,0,0.28); border-radius: 6px; padding: 6px 8px; margin: 4px 0; }
.fcard .fname { font-weight: bold; font-size: 15px; }
.fcard .fkill { color: #ff8a5c; margin-left: 8px; font-size: 13px; font-weight: bold; }
.fcard .fline { margin-top: 2px; }
.fcard .fdmg { color: #f0b49e; }
.hpbar { display: flex; height: 16px; background: #222; border-radius: 4px; overflow: hidden; margin: 4px 0 2px; border: 1px solid rgba(255,255,255,0.15); }
.hpbar i { display: block; height: 100%; }
.hpbar .keep { background: #5aa65a; }
.hpbar .exp { background: #d0442c; }

.hpbar.small { height: 10px; }

.pbar { display: inline-block; width: 96px; height: 9px; background: #333; border-radius: 4px; vertical-align: middle; overflow: hidden; margin: 0 6px 0 4px; }
.pbar i { display: block; height: 100%; background: #c9a227; }
.fcounter { margin-top: 6px; padding-top: 4px; border-top: 1px dashed rgba(255,255,255,0.15); font-size: 13px; }
/* 本拠と相国の膝元（P77） */
.seatfx { color: #d9c08a; margin-top: 2px; }
/* 史実の目標（P76） */
.card.status.histgoal { border-left: 3px solid #5f8f6a; }
/* 史実の合戦（P75） */
.card.status.histbattle { border-left: 3px solid #c9a24a; }

.teach .tarts { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; max-height: 46vh; overflow-y: auto; }

.tmark.borrow { background: #3d5560; color: #d8eef5; }

.oni, select.oni { color: #e0533a !important; font-weight: bold; }
option { color: initial; font-weight: normal; }
option.oni { color: #c0392b; font-weight: bold; }
/* 史実の人物の顔絵（256×320 の胸像） */
.fig.face { height: 46px; width: 37px; flex-basis: 37px; object-fit: cover; object-position: top; border-radius: 4px; border: 1px solid var(--line, rgba(200,170,110,0.5)); margin: 0; }

.pf-name { font: 700 20px var(--mincho); }
.pf-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.pf-stats { border-collapse: collapse; font-size: 12.5px; }

.gname { cursor: pointer; text-decoration: underline dotted rgba(201,162,39,0.6); text-underline-offset: 3px; }
.gname:hover { color: var(--gold, #c9a227); }
.fac { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 12px; line-height: 1.6; margin-left: 4px; }
.cbody { font-size: 13.5px; line-height: 1.7; } .cbody ul { margin: 4px 0; padding-left: 1.4em; }

      button, select, .btn { min-height: 38px; padding: 7px 12px; }
      .chip { min-height: 34px; padding: 4px 9px; margin: 2px 3px 2px 0; font-size: 13.5px; }
      .tmenu button, .sel button, .ups button, .dip button, .rec select, .rec button { min-height: 36px; padding: 5px 10px; font-size: 13px; }
      .speed [data-speed], .ctlbox [data-vol], .ctlbox [data-bgm] { min-width: 36px; padding-left: 0; padding-right: 0; }
      .speed #watch, .speed #ctlMore { padding-left: 8px; padding-right: 8px; }
      .pen { min-width: 36px; font-size: 15px; }
      input[type="checkbox"] { width: 22px; height: 22px; }
      select, input[type="text"] { font-size: 16px; }
      .help-btn { width: 40px; height: 40px; right: calc(8px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); }
      .uicon { width: 22px; height: 22px; }
    }
    /* タブレットの縦持ち・小さめの横持ち：情報欄を少し狭くして地図を広く */
    @media (min-width: 761px) and (max-width: 900px) { .battle { grid-template-columns: 1fr 300px; } .result { left: calc((100% - 300px) / 2); max-width: calc(100% - 320px); } }
    /* スマホの横持ち（高さが低い）：左右に分け、記録の欄は小さく */
    @media (max-height: 520px) and (min-width: 600px) {
      .battle { grid-template-columns: 1fr 46%; grid-template-rows: 1fr; }
      .battle aside { border-top: 0; border-left: 1px solid var(--line); }
      #panel { max-height: none; flex: 1 1 auto; min-height: 0; padding: 6px; }
      #log { flex: 0 0 18%; }
      /* 横持ちは欄が狭いので「速さ」の字を省いて、観戦・速さ・設定を1行に収める */
      .speed > .dim { display: none; }
      .result { left: 50%; max-height: 92vh; padding: 10px 14px; }
      .center { padding: 3vh 14px; }
    }
    /* 狭い画面・低い画面：速さ・音・記録のボタンは1行にまとめ、横になぞって送る（情報欄を広く残すため） */
    @media (max-width: 760px), (max-height: 520px) {
      .battle aside { min-width: 0; overflow: hidden; }
      #ctl { flex: 0 0 auto; min-width: 0; }
      .speed { min-width: 0; max-width: 100%; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior: contain; padding: 4px 8px; flex: 0 0 auto; scrollbar-width: none; }
      .speed > *, .speed .vol > *, .speed .lvl > * { flex: 0 0 auto; }
      .speed #watch { margin-right: 6px; }
      .speed .lvl { flex-basis: auto; margin-left: 6px; }
      #log { flex: 0 0 16%; }
      .battle aside[data-lv="1"] #log { flex-basis: 24%; }
      .battle aside[data-lv="2"] #log { flex-basis: 32%; }
    }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 30; max-width: 90vw; background: var(--card); color: var(--ink); border: 1px solid var(--gold); border-radius: 4px; padding: 8px 14px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
    /* 時間のかかる処理のあいだの表示（src/ui/busy.ts）。下の画面は押せない */
    .busy { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(20,18,15,0.35); cursor: progress; }
    .busy > div { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--gold); border-radius: 4px; padding: 12px 20px; font: 600 16px var(--mincho); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    .busy i { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: busy-spin 0.8s linear infinite; }
    @keyframes busy-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
