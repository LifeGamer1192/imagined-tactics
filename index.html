<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hex-sim</title>
  <meta name="description" content="hist-sim のセーブから始める、ヘックスのターン制戦術ゲーム。日本の戦国と中国の春秋戦国。">
  <meta name="theme-color" content="#1c1a17">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 18v28L32 60 8 46V18z' fill='%23c8553a' stroke='%231c1a17' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23ece4d2'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg: #1c1a17; --panel: #26221d; --line: #4a4136; --ink: #ece4d2; --dim: #a39a88; --accent: #c8553a; --gold: #c9a45a; --card: #1f1c18; --mincho: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", "MS PMincho", serif; }
    * { box-sizing: border-box; }
    html, body, #app { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--ink); font: 14px/1.5 "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; }
    button, select, .btn { font: inherit; color: var(--ink); background: #3a332b; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
    button:hover:not(:disabled), .btn:hover { background: #4d4438; border-color: var(--gold); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: var(--accent); color: #fff6e8; border-color: #e07a5c; font-weight: bold; }
    button.on { outline: 2px solid var(--gold); }
    .dim { color: var(--dim); }
    .error { color: #ff8a7a; min-height: 1.5em; }
    .spacer { flex: 1; }
    .tag { background: var(--gold); color: #1f1a10; border-radius: 4px; padding: 0 5px; font-size: 12px; }
    small { color: var(--dim); font-size: 12px; }

    .center { max-width: 640px; margin: 0 auto; padding: 12vh 20px; text-align: center; }
    .center h1 { font: 700 44px var(--mincho); letter-spacing: 0.18em; margin: 0 0 12px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
    body.title { background: linear-gradient(rgba(20,18,15,0.55), rgba(20,18,15,0.88)), var(--title-bg, none) center / cover no-repeat fixed, var(--bg); }
    h2 { font-family: var(--mincho); }

    .setup { display: flex; flex-direction: column; height: 100%; padding: 12px 16px; gap: 10px; }
    .setup header, .setup footer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .setup .cols { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
    .setup section { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .setup h2 { margin: 0 0 6px; font-size: 18px; }
    .setup section p { margin: 6px 0; }
    .gens { overflow: auto; flex: 1; }
    .gen { display: flex; gap: 8px; align-items: flex-start; padding: 6px 4px; border-top: 1px solid var(--line); cursor: pointer; }
    .gen:hover { background: #2f2a23; }
    .troops { font-size: 13px; }
    details { max-height: 20vh; overflow: auto; }

    .battle { display: grid; grid-template-columns: 1fr 340px; height: 100%; position: relative; }
    .battle canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .battle aside { display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
    #panel { padding: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 76%; overflow: auto; }
    .gens2 { display: flex; flex-direction: column; }
    .gens2 .gen { cursor: default; font-size: 13px; }
    .actions.row { flex-direction: row; }
    .actions.row button { flex: 1; text-align: center; }
    .rec { display: inline-flex; gap: 4px; margin-top: 3px; }
    .rec select, .rec button { padding: 2px 6px; font-size: 12px; }
    .turn { padding: 6px 10px; border-radius: 3px; font: 700 15px var(--mincho); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
    .turn small { color: #fff; opacity: 0.85; font-weight: normal; }
    .card { border-left: 4px solid var(--gold); background: var(--card); border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
    .bar { position: relative; height: 16px; background: #14120f; border-radius: 3px; overflow: hidden; }
    .bar i { position: absolute; inset: 0 auto 0 0; }
    .bar.hp i { background: #5a8f4e; } .bar.mp i { background: #3d6494; }
    .bar span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 16px; }
    .stats { font-size: 13px; }
    .status { color: #e9c98a; font-size: 13px; }
    .actions { display: flex; flex-direction: column; gap: 4px; }
    .actions button { text-align: left; }
    #forecast { min-height: 2.5em; font-size: 13px; color: #e9c98a; }
    .sel { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .sel button { font-size: 12px; padding: 3px 8px; }
    .ups { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .ups button, .dip button { font-size: 12px; padding: 3px 8px; }
    .dip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .small { font-size: 12px; }
    .speed { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; padding: 0 10px 8px; }
    .speed:empty { display: none; }
    .speed #watch { margin-right: auto; }
    .speed [data-speed] { min-width: 30px; padding: 4px 0; text-align: center; }
    /* 音量（切・小・大）。速さのボタンの並びの右に置く。狭いときは次の行に回る */
    .speed .vol { display: inline-flex; gap: 4px; align-items: center; margin-left: 6px; }
    .speed [data-vol] { min-width: 30px; padding: 4px 0; text-align: center; }
    /* 天気と季節 */
    .sky { font-size: 13px; padding: 4px 10px; border-left: 3px solid var(--gold); background: var(--card); border-radius: 3px; }
    .sky small { display: block; color: #e9c98a; font-size: 12px; margin-top: 2px; }
    .foot button { white-space: nowrap; }
    .foot .dim { font-size: 12px; min-width: 0; }
    .foot { flex-wrap: wrap; }
    .foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    #log { flex: 1; overflow: auto; border-top: 1px solid var(--line); padding: 8px 10px; font-size: 12.5px; color: #cfc6b3; }
    #log .sep { color: var(--gold); margin-top: 4px; font-family: var(--mincho); }
    /* 戦闘の記録の細かさ（簡易・通常・詳細）のボタン。速さ・音の並びの下の行に置く */
    .speed .lvl { display: inline-flex; gap: 4px; align-items: center; flex-basis: 100%; justify-content: flex-end; }
    .speed [data-log] { padding: 4px 8px; }
    /* 通常・詳細の記録：1つの行動が、見出しの行＋字下げした行。左の線と名前の色が陣営（攻め手は朱、守り手は藍） */
    #log .blk { margin-top: 5px; padding-left: 6px; border-left: 3px solid var(--line); }
    #log .blk.b0 { border-left-color: #c44830; } #log .blk.b1 { border-left-color: #4e74b8; }
    #log .blk.mv { margin-top: 3px; opacity: 0.85; }
    #log .ln { padding-left: 1em; }
    #log .fm { padding-left: 1.8em; text-indent: -0.8em; font-size: 11.5px; line-height: 1.45; color: #a59c88; }
    #log .s0 { color: #ee9a80; } #log .s1 { color: #9bbcf0; }
    #log .dmg { color: #ffd9a0; font-size: 13.5px; } #log .crit { color: #ffb347; } #log .heal { color: #8fd6b8; }
    #log .miss { color: #9a9384; } #log .down { color: #ff8a7a; }
    /* 細かい記録ほど行が増えるので、記録の欄を広げる（上の情報欄の上限を下げる） */
    .battle aside[data-lv="1"] #panel { max-height: 66%; }
    .battle aside[data-lv="2"] #panel { max-height: 54%; }
    .result { position: absolute; left: calc((100% - 340px) / 2); top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 28px; text-align: center; max-height: 80vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .result h2 { margin: 0 0 6px; font-size: 26px; }
    .savemenu { min-width: min(440px, 92vw); text-align: left; z-index: 5; }
    .center .savemenu { position: fixed; left: 50%; }
    .slot { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
    .slot .info { font-size: 13px; }
    .slot button { padding: 4px 10px; }
    @media (max-width: 760px) {
      /* 狭い画面：上に地図、下に情報。情報欄は1列で、字とボタンを少し詰める */
      body { font-size: 13px; }
      .battle { grid-template-columns: 1fr; grid-template-rows: 46% 54%; }
      .battle aside { border-left: 0; border-top: 1px solid var(--line); }
      #panel { max-height: none; flex: 1 1 auto; min-height: 0; padding: 8px; gap: 6px; }
      #log { flex: 0 0 22%; padding: 6px 8px; font-size: 12px; }
      .battle aside[data-lv="1"] #panel, .battle aside[data-lv="2"] #panel { max-height: none; }
      .battle aside[data-lv="1"] #log { flex-basis: 30%; }
      .battle aside[data-lv="2"] #log { flex-basis: 40%; }
      .foot { flex-wrap: wrap; gap: 6px; }
      .foot button { padding: 5px 9px; }
      .actions { flex-direction: row; flex-wrap: wrap; }
      .actions button { flex: 1 1 46%; }
      .speed { padding: 0 8px 6px; }
      .card { padding: 6px 8px; }
      .setup { padding: 8px; }
      .setup .cols { grid-template-columns: 1fr; overflow: auto; }
      .result { left: 50%; width: 92vw; padding: 14px 16px; }
      .result h2 { font-size: 20px; }
      .center { padding: 6vh 14px; }
      .center h1 { font-size: 32px; }
      .slot { grid-template-columns: 40px 1fr; }
      .slot > :last-child { grid-column: 1 / -1; }
    }

    /* 遊び方の案内（src/ui/help.ts）：右下の「？」と、その重ね表示 */
    .help-btn { position: fixed; right: 8px; bottom: 8px; z-index: 40; width: 30px; height: 30px; padding: 0; border-radius: 50%; font: 700 16px/1 var(--mincho); color: var(--gold); background: rgba(38,34,29,0.88); border-color: var(--gold); }
    .help-back { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,0.62); }
    .help-back[hidden] { display: none; }
    .help { display: flex; flex-direction: column; width: min(780px, 100%); max-height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    .help header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .help header b { font: 700 18px var(--mincho); margin-right: 4px; }
    .help nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .help header button { padding: 4px 10px; }
    .help-body { overflow: auto; overscroll-behavior: contain; padding: 0 18px 18px; line-height: 1.7; }
    .help-body h3 { font: 700 16px var(--mincho); color: var(--gold); margin: 16px 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
    .help-body p { margin: 6px 0; }
    .help-body ul, .help-body ol { margin: 6px 0; padding-left: 1.5em; }
    .help-body dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 6px 0; }
    .help-body dt { color: #e9c98a; font-weight: bold; max-width: 11em; }
    .help-body dd { margin: 0; }
    .help-body .scroll { overflow-x: auto; margin: 4px 0 10px; }
    .help-body table { border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
    .help-body th, .help-body td { border: 1px solid var(--line); padding: 2px 8px; text-align: center; font-weight: normal; }
    .help-body th { color: var(--dim); }
    .help-body th:first-child { text-align: left; }
    /* 編成の画面は右下にボタンがあるので、「？」と重ならないよう下を空ける */
    .setup { padding-bottom: 44px; }
    @media (max-width: 760px) {
      .help-back { padding: 8px; }
      .help header { padding: 8px; gap: 6px; }
      .help-body { padding: 0 10px 14px; }
      .help-body dl { grid-template-columns: 1fr; gap: 0; }
      .help-body dt { max-width: none; }
      .help-body dd { margin: 0 0 6px 0.8em; }
      .help-body th, .help-body td { padding: 2px 5px; }
    }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 30; max-width: 90vw; background: var(--card); color: var(--ink); border: 1px solid var(--gold); border-radius: 4px; padding: 8px 14px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); }
    /* 時間のかかる処理のあいだの表示（src/ui/busy.ts）。下の画面は押せない */
    .busy { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(20,18,15,0.35); cursor: progress; }
    .busy > div { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--gold); border-radius: 4px; padding: 12px 20px; font: 600 16px var(--mincho); box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
    .busy i { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: busy-spin 0.8s linear infinite; }
    @keyframes busy-spin { to { transform: rotate(360deg); } }
  </style>
  <script type="module" crossorigin src="./assets/index-0g-nCOkE.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
